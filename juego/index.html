<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misión a lo Loco</title>
<style>
  :root {
    --bg: #090c1a; --panel: #121830; --panel2: #1b2342; --line: #2c3763;
    --text: #eef1fb; --muted: #a3acca; --accent: #ffb238; --good: #5fd38d; --bad: #ff6b6b; --cyan: #4fd1e6;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 6px 16px; flex-wrap: wrap; align-items: center; }
  header h1 { margin: 0; font-size: 21px; }
  header .sub { color: var(--muted); font-size: 13px; flex: 1 1 240px; }
  main { padding: 16px; max-width: 1320px; margin: 0 auto; }
  h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); }
  h3 { margin: 14px 0 6px; font-size: 13px; color: var(--muted); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  button, input, select { font: inherit; color: var(--text); }
  button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button[aria-pressed="true"] { background: #3b2f10; border-color: var(--accent); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .primary { background: var(--accent); color: #241600; border: 0; font-weight: 700; }
  .big { font-size: 17px; padding: 11px 18px; }
  input[type=text], select { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; width: 100%; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .choice { text-align: left; padding: 12px; border-radius: 10px; display: block; width: 100%; }
  .choice b { display: block; font-size: 16px; margin-bottom: 3px; }
  .choice span { color: var(--muted); font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .stack > * + * { margin-top: 14px; }
  /* design */
  .design { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 14px; align-items: start; }
  @media (max-width: 1000px) { .design { grid-template-columns: 1fr; } }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tabs button { padding: 7px 12px; }
  .tabs small { display: block; font-size: 11px; color: var(--muted); }
  .part { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .part .name { font-weight: 600; }
  .part .stats { font-size: 12px; color: var(--cyan); font-variant-numeric: tabular-nums; }
  .part .desc { font-size: 12px; color: var(--muted); grid-column: 1 / -1; }
  .counter { display: flex; align-items: center; gap: 6px; }
  .counter output { min-width: 18px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; }
  .counter button { width: 34px; padding: 4px 0; }
  .orbit { text-align: left; padding: 10px; }
  .orbit b { display: block; }
  .orbit span { font-size: 12px; color: var(--muted); }
  .orbit .fit { font-size: 12px; margin-top: 4px; }
  .seg { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 12px 0 6px; border-top: 1px solid var(--line); padding-top: 10px; }
  .seg:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
  .meter { margin-bottom: 9px; }
  .meter .top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .meter .top b { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
  .bar { height: 7px; background: var(--panel2); border-radius: 4px; overflow: hidden; margin-top: 3px; }
  .bar i { display: block; height: 100%; background: var(--good); transition: width .2s; }
  .meter.warn .bar i { background: var(--accent); } .meter.bad .bar i { background: var(--bad); }
  .meter.bad b { color: var(--bad); } .meter.warn b { color: var(--accent); }
  .meter p { margin: 2px 0 0; font-size: 11.5px; color: var(--muted); }
  .alerts { list-style: none; padding: 0; margin: 8px 0; font-size: 13px; }
  .alerts li { padding: 4px 0 4px 10px; border-left: 3px solid var(--accent); margin-bottom: 4px; }
  .alerts li.block { border-color: var(--bad); }
  #craft { width: 100%; height: 190px; display: block; }
  .sticky { position: sticky; top: 10px; }
  /* sim */
  .sim { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; }
  @media (max-width: 1000px) { .sim { grid-template-columns: 1fr; } }
  #space { width: 100%; height: 380px; display: block; background: #050814; border-radius: 10px; }
  .modal-wrap { position: fixed; inset: 0; background: rgba(5,8,20,.8); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal { max-width: 520px; width: 100%; background: var(--panel); border: 2px solid var(--accent); border-radius: 12px; padding: 18px; }
  .modal h3 { color: var(--text); font-size: 20px; margin: 0 0 6px; }
  .modal .who { color: var(--accent); font-size: 13px; margin-bottom: 10px; }
  .modal button { display: block; width: 100%; text-align: left; margin-top: 8px; padding: 10px 12px; }
  /* report */
  .score { font-size: 54px; font-weight: 800; color: var(--accent); line-height: 1; }
  .why { list-style: none; padding: 0; margin: 0; }
  .why li { padding: 7px 0 7px 12px; border-left: 3px solid var(--good); margin-bottom: 6px; }
  .why li.bad { border-color: var(--bad); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .secret { background: var(--panel2); border: 1px dashed var(--accent); border-radius: 10px; padding: 14px; margin-top: 10px; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 12px; background: var(--panel2); border: 1px solid var(--line); }
  .learn-link { color: var(--cyan); font-size: 14px; text-decoration: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; }
  .learn-link:hover { border-color: var(--cyan); }
  .learn { margin: 10px 0 0; font-size: 13px; }
  .learn a { color: var(--cyan); }
  footer { color: var(--muted); font-size: 12px; padding: 0 16px 24px; max-width: 1320px; margin: 0 auto; }
</style>
</head>
<body>
<header>
  <h1 id="brand">🚀 Misión a lo Loco</h1>
  <span class="sub" id="tagline">Diseña una misión espacial de verdad: cada decisión tiene un precio.</span>
  <a class="learn-link" href="../" id="learnLink">📚 Aprende con The Last Lap</a>
  <button type="button" id="homeBtn" hidden>⟲ Nueva misión</button>
  <button type="button" id="langBtn" aria-label="Switch to English">EN</button>
</header>
<main id="app"></main>
<footer><span id="footText">Proyecto para NASA Space Apps 2026 · Reto «Space Mission Design Game». Las explicaciones paso a paso están en </span><a href="../" style="color:var(--cyan)">The Last Lap</a>.</footer>
<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
